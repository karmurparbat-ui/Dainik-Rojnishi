<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>દૈનિક રોજનીશી - લોગિન</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rasa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #1a5f7a; --bg-color: #f0f2f5; }
        body { font-family: 'Rasa', serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 15px; }
        
        .auth-card { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; border-top: 6px solid var(--primary-color); }
        
        .logo-circle { width: 80px; height: 80px; background-color: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; }
        .logo-circle svg { width: 40px; height: 40px; stroke: white; stroke-width: 2; fill: none; }
        
        .auth-card h2 { color: #333; margin: 0 0 10px 0; font-size: 28px; font-weight: bold; }
        .auth-card p { color: #666; font-size: 18px; margin-bottom: 30px; }
        
        .btn-google { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background-color: white; color: #444; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-google:hover { background-color: #f8f9fa; border-color: #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-google img { width: 24px; height: 24px; margin-right: 12px; }
        
        #errorMsg { margin-top: 15px; font-size: 14px; color: #d32f2f; font-weight: bold; display: none; background: #ffebee; padding: 10px; border-radius: 6px; border: 1px solid #ef9a9a; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
        
        <h2>દૈનિક રોજનીશી</h2>
        <p>શિક્ષકો માટેનું સ્માર્ટ પ્લેટફોર્મ</p>
        
        <button class="btn-google" id="googleBtn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            Google વડે લોગિન કરો
        </button>
        
        <div id="errorMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        // setPersistence અને browserLocalPersistence ઉમેર્યા છે[cite: 2]
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDY8EyUxzOivMNzTsaHV9M8EvF48nLlYAA",
            authDomain: "dainikrojnishi.firebaseapp.com",
            projectId: "dainikrojnishi",
            storageBucket: "dainikrojnishi.firebasestorage.app",
            messagingSenderId: "60107107456",
            appId: "1:60107107456:web:fa958369acd57cdc900a65",
            measurementId: "G-SSM6EX4LRM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // ડાયરેક્ટ એકાઉન્ટ સિલેક્ટ કરવા માટે
        provider.setCustomParameters({ prompt: 'select_account' });

        // યુઝર પહેલેથી લોગિન છે કે નહિ તે ચેક કરો[cite: 2]
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace("index.html");
            }
        });

        window.loginWithGoogle = async function() {
            const btn = document.getElementById('googleBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            btn.innerText = "પ્રક્રિયા ચાલુ છે...";
            btn.disabled = true;

            try {
                // પહેલા મેમરી સેટ કરો, પછી જ લોગિન પોપ-અપ લાવો
                await setPersistence(auth, browserLocalPersistence);
                const result = await signInWithPopup(auth, provider);
                
                if (result.user) {
                    window.location.replace("index.html");
                }
            } catch (error) {
                console.error("લોગિન એરર:", error);
                
                // બટન પાછું મૂળ સ્થિતિમાં લાવો
                btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo"> Google વડે લોગિન કરો`;
                btn.disabled = false;
                
                // અસલી એરર સ્ક્રીન પર બતાવો
                errorMsg.innerHTML = `<strong>લોગિન નિષ્ફળ:</strong><br>${error.message} <br><small>(${error.code})</small>`;
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
